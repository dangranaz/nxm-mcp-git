<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>nxm-git — one core, two consumers, one policy</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:  'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono:  'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem; font-weight: 500;
      letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400; letter-spacing: -0.02em; line-height: 1.15;
      color: var(--color-ink); margin-bottom: 1.25rem;
    }
    svg { width: 100%; min-width: 1180px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>nxm-git — one core, two consumers, one policy</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1180 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="nxmgit-arch-title nxmgit-arch-desc">
        <title id="nxmgit-arch-title">nxm-git architecture: one core, two consumers, one policy</title>
        <desc id="nxmgit-arch-desc">An AI agent over MCP and a future TUI both call one Rust core that exposes seven structured read tools and seven policy-gated write tools against a Git repository.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bf4520"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ================= ARROWS (drawn before boxes) ================= -->
        <!-- Agent (MCP) -> core : horizontal -->
        <line x1="236" y1="180" x2="404" y2="180" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <rect x="280" y="150" width="54" height="13" fill="#f5f5f5"/>
        <text x="307" y="160" fill="#2e5aa8" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">HTTP/MCP</text>

        <!-- TUI -> core : horizontal, dashed (future / in-process) -->
        <line x1="236" y1="300" x2="404" y2="300" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <rect x="276" y="270" width="62" height="13" fill="#f5f5f5"/>
        <text x="307" y="280" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">IN-PROCESS</text>

        <!-- core -> READ zone : leave core right edge, go up, enter READ left edge at y=150 -->
        <path d="M624,196 H668 Q676,196 676,188 V158 Q676,150 684,150 H720" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- core -> WRITE zone : leave core right edge, go down, enter WRITE left edge at y=312 -->
        <path d="M624,264 H668 Q676,264 676,272 V304 Q676,312 684,312 H720" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <rect x="636" y="224" width="80" height="13" fill="#f5f5f5"/>
        <text x="676" y="234" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="8" text-anchor="middle" letter-spacing="0.06em">POLICY GATE</text>

        <!-- READ zone -> Git repo : right, down the outer column, into top edge at x=1036 -->
        <path d="M1012,150 H1032 Q1040,150 1040,158 V414 Q1040,422 1036,422 L1036,430" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- WRITE zone -> Git repo : right, down, into top edge at x=1084 -->
        <path d="M1012,312 H1076 Q1084,312 1084,320 V430" fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <!-- ================= CONSUMERS (left) ================= -->
        <!-- Agent (MCP) : input node -->
        <rect x="80" y="150" width="156" height="60" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="92" y="162" width="70" height="14" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="127" y="172" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.14em">CONSUMER</text>
        <text x="100" y="196" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">Agent · MCP</text>

        <!-- NXM TUI : optional / future -->
        <rect x="80" y="270" width="156" height="60" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="92" y="282" width="52" height="14" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="118" y="292" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.14em">FUTURE</text>
        <text x="100" y="316" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">NXM TUI</text>

        <!-- ================= CORE (focal, center) ================= -->
        <rect x="404" y="120" width="220" height="190" rx="8" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.4"/>
        <rect x="420" y="134" width="60" height="14" rx="2" fill="#f5f5f5"/>
        <text x="450" y="144" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.14em">CORE LIB</text>
        <text x="420" y="178" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="16" font-weight="600">nxm-git</text>
        <text x="420" y="200" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="9">typed read + write</text>
        <!-- inner policy gate -->
        <rect x="420" y="224" width="188" height="68" rx="6" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="432" y="248" fill="#bf4520" font-family="'Geist', system-ui, sans-serif" font-size="12" font-weight="600">policy gate</text>
        <text x="432" y="266" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">protected branch · force</text>
        <text x="432" y="280" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">forbidden-content scan</text>

        <!-- ================= READ zone ================= -->
        <rect x="720" y="110" width="292" height="80" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <rect x="820" y="114" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="866" y="123" fill="#5a6580" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.14em">READ · STRUCTURED</text>
        <text x="736" y="150" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">7 read tools → JSON</text>
        <text x="736" y="172" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">status · diff · log · branches · show · blame · scan</text>

        <!-- ================= WRITE zone ================= -->
        <rect x="720" y="272" width="292" height="80" rx="8" fill="rgba(191,69,32,0.05)" stroke="rgba(191,69,32,0.50)" stroke-width="0.9" stroke-dasharray="4,4"/>
        <rect x="818" y="276" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="866" y="285" fill="#bf4520" font-family="'Geist Mono', ui-monospace, monospace" font-size="7" text-anchor="middle" letter-spacing="0.14em">WRITE · POLICY-GATED</text>
        <text x="736" y="312" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">7 write tools → guarded</text>
        <text x="736" y="334" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">commit · branch · integration · worktree · switch · push · pr</text>

        <!-- ================= Git repo (right) ================= -->
        <rect x="1004" y="430" width="112" height="60" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="1016" y="442" width="58" height="14" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.20)" stroke-width="0.8"/>
        <text x="1045" y="452" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="7.5" text-anchor="middle" letter-spacing="0.14em">EXTERNAL</text>
        <text x="1024" y="476" fill="#2d3142" font-family="'Geist', system-ui, sans-serif" font-size="13" font-weight="600">Git · GitHub</text>

        <!-- ================= LEGEND (bottom strip) ================= -->
        <line x1="80" y1="560" x2="1040" y2="560" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <!-- focal -->
        <rect x="80" y="578" width="18" height="12" rx="3" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="106" y="588" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">core &amp; policy (focal)</text>
        <!-- read arrow -->
        <line x1="300" y1="584" x2="330" y2="584" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="340" y="588" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">agent call (MCP)</text>
        <!-- write arrow -->
        <line x1="500" y1="584" x2="530" y2="584" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="540" y="588" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">gated write</text>
        <!-- dashed -->
        <line x1="672" y1="584" x2="702" y2="584" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="712" y="588" fill="#4f5d75" font-family="'Geist Mono', ui-monospace, monospace" font-size="8.5">future / in-process</text>
      </svg>
    </div>
  </div>
</body>
</html>
